name: forge-issue962
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base on upstream master and apply the fix
        run: |
          set -e
          git remote add upstream https://github.com/anywhere-labs/dsh-desktop.git
          git fetch upstream master
          git config user.name "JINITAIMEI121"
          git config user.email "JINITAIMEI121@users.noreply.github.com"
          git checkout -B fix/connection-get-body-mode upstream/master
          echo '' | base64 -d > forge-helper.cjs
          echo '' | base64 -d > 'patches/dsh-client-connection@0.1.5-rc.2.patch'
          echo '' | base64 -d > 'dsh-plugin-desktop/tests/connection-get-body-mode-patch.spec.ts'
          node forge-helper.cjs '@deepseek-ai/dsh-client-connection'
      - name: Install and test
        run: |
          set -e
          corepack enable
          yarn install --mode=update-lockfile
          yarn workspace dsh-plugin-desktop vitest run tests/connection-get-body-mode-patch.spec.ts
      - name: Commit and push
        run: |
          set -e
          git add -A
          git commit -m "fix(connection): keep GET/HEAD Fetch routes off the streaming body carrier (#962)"
          git push --force origin fix/connection-get-body-mode
