name: forge-rework
on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Which fix to rebuild onto rc.2 (937 | 938 | 964)"
        required: true
        default: "964"
permissions:
  contents: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base on upstream master
        run: |
          git remote add upstream https://github.com/anywhere-labs/dsh-desktop.git
          git fetch upstream master
          git config user.name "JINITAIMEI121"
          git config user.email "JINITAIMEI121@users.noreply.github.com"
      - name: Tooling
        run: |
          set -e
          echo '' | base64 -d > forge-helper.cjs
          git reset --hard upstream/master
          corepack enable
          yarn --version
      - name: Rebuild 937 (pi-ai network-first discovery)
        if: ${{ inputs.fix == '937' }}
        run: |
          set -e
          git checkout -B fix/model-discovery-network-first upstream/master
          echo '' | base64 -d > 'patches/dsh-llm-pi-ai@0.1.5-rc.2.patch'
          echo '' | base64 -d > 'dsh-plugin-desktop/tests/model-discovery-patch.spec.ts'
          node forge-helper.cjs resolutions '@deepseek-ai/dsh-llm-pi-ai'
          yarn install --mode=update-lockfile
          git add -A
          git commit -m "fix(pi-ai): probe the endpoint before the catalog when discovering models (rc.2)"
          git push --force origin fix/model-discovery-network-first
      - name: Rebuild 938 (adapter prepareCall compat)
        if: ${{ inputs.fix == '938' }}
        run: |
          set -e
          git checkout -B fix/adapter-prepare-call-compat upstream/master
          echo '' | base64 -d > 'patches/dsh-llm@0.1.5-rc.2.patch'
          echo '' | base64 -d > 'dsh-plugin-desktop/tests/adapter-prepare-call-compat-patch.spec.ts'
          node forge-helper.cjs resolutions '@deepseek-ai/dsh-llm'
          yarn install --mode=update-lockfile
          git add -A
          git commit -m "fix(llm): feature-detect prepareCall on registered adapters (rc.2)"
          git push --force origin fix/adapter-prepare-call-compat
      - name: Rebuild 964 (Linux runner node mode)
        if: ${{ inputs.fix == '964' }}
        run: |
          set -e
          git checkout -B fix/linux-runner-node-mode upstream/master
          echo '' | base64 -d > 'patches/dsh-subprocess-local@0.1.5-rc.2.patch'
          node forge-helper.cjs linux-test
          yarn install --mode=update-lockfile
          git add -A
          git commit -m "fix(linux): start the scoped subprocess runner in Electron Node mode (rc.2)"
          git push --force origin fix/linux-runner-node-mode
